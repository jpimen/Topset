<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="" />
    <meta name="description" content="Topset — a clearer way to coach strength." />
    <title>Topset — Strength, with a plan</title>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const scope = location.pathname.startsWith('/coach') ? 'coach' : location.pathname.startsWith('/athlete') ? 'athlete' : null;
          const stored = localStorage.getItem('topset-theme');
          const scoped = scope ? localStorage.getItem(`topset-theme:${scope}`) : null;
          if (scoped === 'light' || scoped === 'dark') theme = scoped;
          else if (stored === 'light' || stored === 'dark') theme = stored;
        } catch {
          // Keep the dark default when browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
